name: Build 0xrex — All Platforms

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            artifact: 0xrex-windows
            ext: zip
          - os: macos-latest
            platform: macos
            artifact: 0xrex-macos
            ext: zip
          - os: ubuntu-22.04
            platform: linux
            artifact: 0xrex-linux
            ext: tar.gz

    runs-on: ${{ matrix.os }}
    name: Build — ${{ matrix.platform }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # ── Linux: install GTK3 + WebKit2 for pywebview ──
      - name: Install Linux system deps
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgirepository1.0-dev \
            gir1.2-webkit2-4.1 \
            libwebkit2gtk-4.1-dev \
            libcairo2-dev \
            pkg-config \
            python3-gi \
            python3-gi-cairo \
            gobject-introspection

      # ── macOS: no extra system deps needed (WebKit is native) ──

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install pywebview
          pip install -r requirements.txt

      # Linux needs PyGObject installed via pip after system deps
      - name: Install PyGObject (Linux)
        if: matrix.platform == 'linux'
        run: pip install PyGObject

      # ── Build with PyInstaller ──
      - name: Build with PyInstaller
        run: pyinstaller 0xrex.spec --noconfirm --clean

      # ── Package: Windows → zip ──
      - name: Package (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: Compress-Archive -Path dist/0xrex/* -DestinationPath ${{ matrix.artifact }}.zip

      # ── Package: macOS → zip ──
      - name: Package (macOS)
        if: matrix.platform == 'macos'
        run: cd dist && zip -r ../${{ matrix.artifact }}.zip 0xrex/

      # ── Package: Linux → tar.gz ──
      - name: Package (Linux)
        if: matrix.platform == 'linux'
        run: cd dist && tar -czf ../${{ matrix.artifact }}.tar.gz 0xrex/

      # ── Upload build artifact ──
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.${{ matrix.ext }}
          retention-days: 30

  # ── Create GitHub Release with all platform builds ──
  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: 0xrex ${{ github.ref_name }}
          body: |
            ## 0xrex ${{ github.ref_name }}

            ### Downloads
            | Platform | File |
            |----------|------|
            | Windows  | `0xrex-windows.zip` |
            | macOS    | `0xrex-macos.zip` |
            | Linux    | `0xrex-linux.tar.gz` |

            ---
            Built automatically via GitHub Actions.
          draft: false
          prerelease: false
          files: |
            release-assets/0xrex-windows/0xrex-windows.zip
            release-assets/0xrex-macos/0xrex-macos.zip
            release-assets/0xrex-linux/0xrex-linux.tar.gz
