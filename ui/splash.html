<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap');

* { margin:0; padding:0; box-sizing:border-box; }
body {
  background: #1c1917;
  color: #fafaf9;
  font-family: 'JetBrains Mono', 'Courier New', monospace;
  overflow: hidden;
  height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  position: relative;
}
/* Scanlines */
body::before {
  content: '';
  position: fixed;
  top:0;left:0;right:0;bottom:0;
  background: repeating-linear-gradient(
    0deg,
    transparent 0px,
    rgba(245,158,11,0.012) 1px,
    transparent 2px
  );
  pointer-events: none;
  z-index: 100;
}
body::after {
  content: '';
  position: fixed;
  top:0;left:0;right:0;bottom:0;
  background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.5) 100%);
  pointer-events: none;
  z-index: 99;
}

.boot-container {
  display: flex;
  align-items: flex-start;
  gap: 30px;
}

.boot-right {
  display: flex;
  flex-direction: column;
  align-items: center;
}

.boot-header {
  text-align: center;
  margin-bottom: 30px;
}

/* ── 3D Cash Stack ── */
.cash3d-wrap {
  display: inline-block;
  margin: 0 auto 10px;
  animation: cashGlitchMove 3s ease-in-out infinite, sceneFlicker 3s ease infinite;
}
.cash3d {
  width: 120px;
  height: 72px;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
}
.cash3d-scene {
  width: 120px;
  height: 72px;
  perspective: 600px;
  position: relative;
}
.cash3d-rotator {
  width: 100%;
  height: 100%;
  position: relative;
  transform-style: preserve-3d;
  animation: cashSpin 5s linear infinite;
}
@keyframes cashSpin {
  0%   { transform: rotateY(0deg) rotateX(-15deg); }
  100% { transform: rotateY(360deg) rotateX(-15deg); }
}
.cash3d-face {
  position: absolute;
  backface-visibility: visible;
}
/* Front & back bill faces */
.cash3d-front, .cash3d-back {
  width: 120px; height: 72px;
  top: 0; left: 0;
}
.cash3d-front { transform: translateZ(14px); }
.cash3d-back  { transform: rotateY(180deg) translateZ(14px); }
/* Side edges */
.cash3d-right {
  width: 28px; height: 72px;
  top: 0; left: 46px;
  transform: rotateY(90deg) translateZ(60px);
}
.cash3d-left {
  width: 28px; height: 72px;
  top: 0; left: 46px;
  transform: rotateY(-90deg) translateZ(60px);
}
/* Top & bottom edges */
.cash3d-top {
  width: 120px; height: 28px;
  top: 22px; left: 0;
  transform: rotateX(90deg) translateZ(36px);
}
.cash3d-bottom {
  width: 120px; height: 28px;
  top: 22px; left: 0;
  transform: rotateX(-90deg) translateZ(36px);
}
/* Bill face styling */
.bill-face {
  width: 100%; height: 100%;
  background: linear-gradient(135deg, rgba(0,212,255,0.08) 0%, rgba(0,255,170,0.12) 50%, rgba(0,212,255,0.08) 100%);
  border: 2px solid rgba(0,212,255,0.7);
  border-radius: 4px;
  position: relative;
  overflow: hidden;
  box-shadow: inset 0 0 16px rgba(0,212,255,0.15);
}
.bill-border {
  position: absolute;
  top: 3px; left: 5px; right: 5px; bottom: 3px;
  border: 1px solid rgba(0,212,255,0.3);
  border-radius: 2px;
}
.bill-oval {
  position: absolute;
  width: 32px; height: 32px;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  border: 1.5px solid rgba(0,255,170,0.35);
  border-radius: 50%;
}
.bill-dollar {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  font-family: 'Georgia', serif;
  font-size: 28px;
  font-weight: 900;
  color: rgba(0,212,255,0.9);
  text-shadow: 0 0 6px rgba(0,212,255,0.6);
  z-index: 1;
}
.bill-100 {
  position: absolute;
  bottom: 5px; right: 8px;
  font-family: 'Courier New', monospace;
  font-size: 10px;
  font-weight: bold;
  color: rgba(0,212,255,0.5);
}
/* Stack edges - repeating lines for paper layers */
.stack-edge {
  width: 100%; height: 100%;
  background: repeating-linear-gradient(90deg, rgba(0,30,40,0.4) 0px, rgba(0,212,255,0.25) 0.8px, rgba(0,30,40,0.4) 1.6px);
  border: 1px solid rgba(0,212,255,0.5);
}
.stack-edge-h {
  width: 100%; height: 100%;
  background: repeating-linear-gradient(0deg, rgba(0,30,40,0.4) 0px, rgba(0,212,255,0.25) 0.8px, rgba(0,30,40,0.4) 1.6px);
  border: 1px solid rgba(0,212,255,0.5);
}
/* Green elastic band */
.band-face {
  position: absolute;
  backface-visibility: visible;
  background: linear-gradient(90deg, rgba(34,197,94,0.2) 0%, rgba(34,197,94,0.6) 40%, rgba(22,163,74,0.6) 60%, rgba(34,197,94,0.2) 100%);
  border: 1px solid rgba(34,197,94,0.8);
  box-shadow: 0 0 8px rgba(34,197,94,0.4), inset 0 0 4px rgba(34,197,94,0.2);
}
.band-front, .band-back {
  width: 28px; height: 72px;
  top: 0; left: 46px;
}
.band-front { transform: translateZ(14.3px); }
.band-back  { transform: rotateY(180deg) translateZ(14.3px); }
.band-top, .band-bottom {
  width: 28px; height: 28px;
  left: 46px; top: 22px;
}
.band-top    { transform: rotateX(90deg) translateZ(36px); }
.band-bottom { transform: rotateX(-90deg) translateZ(36px); }
/* Glow behind the stack */
.cash3d-rotator::after {
  content: '';
  position: absolute;
  top: -20px; left: -20px; right: -20px; bottom: -20px;
  background: radial-gradient(circle, rgba(0,229,255,0.15) 0%, transparent 60%);
  animation: cashGlow 2s ease-in-out infinite;
  pointer-events: none;
}
@keyframes cashGlow { 0%,100%{opacity:0.3} 50%{opacity:0.8} }
/* Glitch effect */
@keyframes cashGlitchMove {
  0%, 70% { transform: translate(0, 0) skew(0); filter: none; }
  71% { transform: translate(6px, -3px) skewX(-4deg); filter: hue-rotate(90deg) brightness(2) saturate(3); }
  72% { transform: translate(-8px, 3px) skewX(5deg); filter: hue-rotate(-60deg) brightness(0.4); }
  73% { transform: translate(4px, -2px) skewX(-3deg); filter: brightness(3) saturate(4) hue-rotate(120deg); }
  74% { transform: translate(-5px, 4px) skewX(6deg); filter: hue-rotate(-120deg) brightness(0.3); }
  75% { transform: translate(0, 0) skew(0); filter: none; }
  85% { transform: translate(0, 0) skew(0); filter: none; }
  86% { transform: translate(-5px, 2px) skewX(4deg); filter: brightness(0.2) hue-rotate(-90deg); }
  87% { transform: translate(8px, -3px) skewX(-7deg); filter: saturate(5) brightness(3); }
  88% { transform: translate(0, 0) skew(0); filter: none; }
  100% { transform: translate(0, 0) skew(0); filter: none; }
}
@keyframes sceneFlicker {
  0%, 100% { opacity: 1; }
  71% { opacity: 1; }
  71.5% { opacity: 0; }
  72% { opacity: 0.7; }
  72.5% { opacity: 0; }
  73% { opacity: 1; }
  73.5% { opacity: 0.1; }
  74% { opacity: 0.8; }
  75% { opacity: 0; }
  75.5% { opacity: 1; }
  86% { opacity: 1; }
  86.5% { opacity: 0; }
  87% { opacity: 0.5; }
  87.5% { opacity: 0; }
  88% { opacity: 1; }
}

.boot-logo {
  font-family: 'Orbitron', monospace;
  font-size: 42px;
  font-weight: 900;
  color: #f59e0b;
  text-shadow: 0 0 10px rgba(245,158,11,0.5), 0 0 30px rgba(245,158,11,0.2);
  letter-spacing: 12px;
  animation: logoFlicker 4s ease-in-out infinite;
}
.boot-sub {
  font-family: 'Orbitron', monospace;
  font-size: 10px;
  color: #a8a29e;
  letter-spacing: 6px;
  margin-top: 8px;
  opacity: 0.8;
}

@keyframes logoFlicker {
  0%,100% { opacity:1; }
  92% { opacity:1; }
  93% { opacity:0.3; }
  94% { opacity:1; }
  96% { opacity:0.6; }
  97% { opacity:1; }
}

.terminal {
  width: 620px;
  background: rgba(42,37,35,0.6);
  border: 1px solid #3d3835;
  border-radius: 8px;
  padding: 20px;
  position: relative;
  box-shadow: 0 0 15px rgba(245,158,11,0.05), inset 0 0 30px rgba(0,0,0,0.3);
}
.terminal-header {
  display: flex;
  justify-content: space-between;
  border-bottom: 1px solid #3d3835;
  padding-bottom: 8px;
  margin-bottom: 12px;
  font-size: 10px;
  color: #78716c;
  font-family: 'Orbitron', monospace;
  letter-spacing: 1px;
}

#log {
  font-size: 12px;
  line-height: 1.7;
  min-height: 240px;
  max-height: 240px;
  overflow: hidden;
  color: #a8a29e;
}
#log .line {
  opacity: 0;
  animation: lineIn 0.1s forwards;
  white-space: nowrap;
}
@keyframes lineIn {
  to { opacity: 1; }
}
.line .ok { color: #22c55e; }
.line .warn { color: #f59e0b; }
.line .info { color: #22d3ee; }
.line .dim { color: #57534e; }
.line .bright { color: #f59e0b; text-shadow: 0 0 6px rgba(245,158,11,0.4); }

.progress-wrap {
  margin-top: 16px;
  border: 1px solid #3d3835;
  height: 18px;
  position: relative;
  background: #1c1917;
  border-radius: 4px;
  overflow: hidden;
}
.progress-bar {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, #d97706, #f59e0b);
  box-shadow: 0 0 10px rgba(245,158,11,0.3);
  transition: width 0.3s ease;
}
.progress-text {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 10px;
  color: #fafaf9;
  letter-spacing: 2px;
  z-index: 2;
  font-family: 'Orbitron', monospace;
}

.status-row {
  display: flex;
  justify-content: space-between;
  margin-top: 10px;
  font-size: 10px;
  color: #57534e;
  font-family: 'JetBrains Mono', monospace;
}
</style>
</head>
<body>

<div class="boot-container">
  <div class="boot-right">
    <div class="boot-header">
      <div class="cash3d-wrap">
        <span class="cash3d">
          <div class="cash3d-scene">
            <div class="cash3d-rotator">
              <div class="cash3d-face cash3d-front"><div class="bill-face"><div class="bill-border"></div><div class="bill-oval"></div><span class="bill-dollar">$</span><span class="bill-100">100</span></div></div>
              <div class="cash3d-face cash3d-back"><div class="bill-face"><div class="bill-border"></div><div class="bill-oval"></div><span class="bill-dollar">$</span><span class="bill-100">100</span></div></div>
              <div class="cash3d-face cash3d-right"><div class="stack-edge"></div></div>
              <div class="cash3d-face cash3d-left"><div class="stack-edge"></div></div>
              <div class="cash3d-face cash3d-top"><div class="stack-edge-h"></div></div>
              <div class="cash3d-face cash3d-bottom"><div class="stack-edge-h"></div></div>
              <div class="band-face band-front"></div>
              <div class="band-face band-back"></div>
              <div class="band-face band-top"></div>
              <div class="band-face band-bottom"></div>
            </div>
          </div>
        </span>
      </div>
      <div class="boot-logo">0xrex</div>
      <div class="boot-sub">AUTONOMOUS TRADING FRAMEWORK</div>
    </div>

    <div class="terminal">
      <div class="terminal-header">
        <span>0xrex BOOT SEQUENCE</span>
        <span id="clock">00:00:00</span>
      </div>
      <div id="log"></div>
      <div class="progress-wrap">
        <div class="progress-bar" id="pbar"></div>
        <div class="progress-text" id="ptxt">INITIALISING...</div>
      </div>
      <div class="status-row">
        <span id="sLeft">SUBSYSTEMS: STANDBY</span>
        <span id="sRight">ENCRYPTION: AES-256-GCM</span>
      </div>
    </div>
  </div>
</div>

<script>
const log = document.getElementById('log');
const pbar = document.getElementById('pbar');
const ptxt = document.getElementById('ptxt');
const sLeft = document.getElementById('sLeft');

setInterval(() => {
  const d = new Date();
  document.getElementById('clock').textContent =
    d.toTimeString().split(' ')[0];
}, 1000);

const lines = [
  { t:200,  txt:'> BIOS POST CHECK .......................... <span class="ok">[PASS]</span>' },
  { t:400,  txt:'> MEMORY ALLOCATION 4096MB ................. <span class="ok">[OK]</span>' },
  { t:600,  txt:'> SECURE BOOT VERIFICATION ................. <span class="ok">[VERIFIED]</span>' },
  { t:900,  txt:'> LOADING KERNEL MODULES ................... <span class="ok">[OK]</span>' },
  { t:1100, txt:'<span class="dim">  &#9500;&#9472;&#9472; crypto.aes256 ..................... loaded</span>' },
  { t:1250, txt:'<span class="dim">  &#9500;&#9472;&#9472; net.tls1.3 ....................... loaded</span>' },
  { t:1400, txt:'<span class="dim">  &#9492;&#9472;&#9472; sys.watchdog ..................... loaded</span>' },
  { t:1700, txt:'> INITIALISING TRADING ENGINE .............. <span class="info">[INIT]</span>' },
  { t:2000, txt:'> MOUNTING ENCRYPTED FILESYSTEM ............ <span class="ok">[MOUNTED]</span>' },
  { t:2300, txt:'> LOADING MARKET DATA FEEDS ................ <span class="ok">[CONNECTED]</span>' },
  { t:2600, txt:'> PORTFOLIO ENGINE BOOTSTRAP ............... <span class="ok">[READY]</span>' },
  { t:2900, txt:'> RISK MANAGEMENT MODULE ................... <span class="ok">[ARMED]</span>' },
  { t:3200, txt:'> SIGNAL PROCESSING PIPELINE ............... <span class="ok">[ONLINE]</span>' },
  { t:3500, txt:'> BROKER API HANDSHAKE ..................... <span class="warn">[STANDBY]</span>' },
  { t:3800, txt:'> AUTONOMOUS AGENT CORE ................... <span class="ok">[LOADED]</span>' },
  { t:4100, txt:'> SCANNING CRYPTO UNIVERSE (50+ ASSETS) ... <span class="info">[CACHED]</span>' },
  { t:4400, txt:'> SENTIMENT ANALYSIS ENGINE ................ <span class="ok">[READY]</span>' },
  { t:4700, txt:'> WEBSOCKET CHANNELS ...................... <span class="ok">[OPEN]</span>' },
  { t:5000, txt:'> COMMAND & CONTROL INTERFACE .............. <span class="ok">[ONLINE]</span>' },
  { t:5300, txt:'> STOP-LOSS / TAKE-PROFIT MONITOR ......... <span class="ok">[ARMED]</span>' },
  { t:5600, txt:'> FIREWALL RULES .......................... <span class="ok">[ENFORCED]</span>' },
  { t:5900, txt:'> SYSTEM INTEGRITY CHECK .................. <span class="ok">[PASS]</span>' },
  { t:6200, txt:'<span class="bright">> ALL SUBSYSTEMS OPERATIONAL</span>' },
  { t:6500, txt:'<span class="bright">> LAUNCHING 0xrex INTERFACE...</span>' },
];

const totalLines = lines.length;
lines.forEach((l, i) => {
  setTimeout(() => {
    const div = document.createElement('div');
    div.className = 'line';
    div.innerHTML = l.txt;
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
    const pct = Math.round(((i+1) / totalLines) * 100);
    pbar.style.width = pct + '%';
    ptxt.textContent = pct + '%';
    if (pct > 50) sLeft.textContent = 'SUBSYSTEMS: LOADING';
    if (pct > 90) sLeft.textContent = 'SUBSYSTEMS: ONLINE';
  }, l.t);
});

setTimeout(() => {
  ptxt.textContent = 'SYSTEM READY';
  ptxt.style.textShadow = '0 0 8px rgba(245,158,11,0.5)';
  if (window.pywebview) {
    window.pywebview.api.boot_complete();
  }
}, 7000);
</script>
</body>
</html>
