<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap');

* { margin:0; padding:0; box-sizing:border-box; }
body {
  background: #1c1917;
  color: #fafaf9;
  font-family: 'JetBrains Mono', 'Courier New', monospace;
  overflow: hidden;
  height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  position: relative;
}
/* Scanlines */
body::before {
  content: '';
  position: fixed;
  top:0;left:0;right:0;bottom:0;
  background: repeating-linear-gradient(
    0deg,
    transparent 0px,
    rgba(245,158,11,0.012) 1px,
    transparent 2px
  );
  pointer-events: none;
  z-index: 100;
}
body::after {
  content: '';
  position: fixed;
  top:0;left:0;right:0;bottom:0;
  background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.5) 100%);
  pointer-events: none;
  z-index: 99;
}

.boot-container {
  display: flex;
  align-items: flex-start;
  gap: 30px;
}

.boot-right {
  display: flex;
  flex-direction: column;
  align-items: center;
}

.boot-header {
  text-align: center;
  margin-bottom: 30px;
}

/* ── 3D Bitcoin Coin Hologram ── */
.btc3d { width:80px; height:68px; display:flex; align-items:center; justify-content:center; position:relative; margin:0 auto 10px; }
.btc3d-scene { width:56px; height:56px; perspective:180px; position:relative; }
.btc3d-rotator { width:100%; height:100%; position:absolute; top:0; left:0; transform-style:preserve-3d; animation:btcSpin 4s linear infinite, btcGlitch 8s ease-in-out infinite; }
@keyframes btcSpin { 0%{transform:rotateY(0deg) rotateX(-12deg)} 100%{transform:rotateY(360deg) rotateX(-12deg)} }
.btc3d-face { position:absolute; width:56px; height:56px; border-radius:50%; backface-visibility:visible; }
.btc3d-front { transform:translateZ(7px); }
.btc3d-back { transform:rotateY(180deg) translateZ(7px); }
.btc-coin-face { width:100%; height:100%; border-radius:50%; background:radial-gradient(ellipse at 35% 25%, rgba(255,210,80,0.35) 0%, rgba(245,158,11,0.18) 35%, rgba(160,90,0,0.12) 100%); border:1.5px solid rgba(245,158,11,0.85); position:relative; overflow:hidden; box-shadow:inset 0 -2px 6px rgba(0,0,0,0.2), inset 0 2px 6px rgba(255,220,100,0.15), 0 0 10px rgba(245,158,11,0.2); }
.btc-ring { position:absolute; top:4px; left:4px; right:4px; bottom:4px; border:1px solid rgba(245,158,11,0.35); border-radius:50%; }
.btc-symbol { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); font-family:'Georgia','Times New Roman',serif; font-size:28px; font-weight:900; color:rgba(245,158,11,0.95); text-shadow:0 0 8px rgba(245,158,11,0.5), 0 0 20px rgba(255,180,0,0.25); z-index:1; line-height:1; }
.btc-symbol::before, .btc-symbol::after { content:''; position:absolute; width:1.5px; top:-3px; bottom:-3px; background:rgba(245,158,11,0.8); box-shadow:0 0 3px rgba(245,158,11,0.4); }
.btc-symbol::before { left:7px; }
.btc-symbol::after { left:13px; }
.btc-holo-sheen { position:absolute; top:0; left:-100%; width:100%; height:100%; border-radius:50%; background:linear-gradient(105deg, transparent 0%, rgba(255,255,255,0.15) 40%, rgba(0,220,255,0.08) 50%, rgba(255,255,255,0.12) 60%, transparent 100%); animation:holoSweep 2.5s ease-in-out infinite; pointer-events:none; }
@keyframes holoSweep { 0%{left:-100%} 50%{left:100%} 100%{left:-100%} }
.btc3d-layer { position:absolute; width:56px; height:56px; top:0; left:0; border-radius:50%; background:linear-gradient(180deg, rgba(220,160,30,0.9) 0%, rgba(180,110,0,0.85) 30%, rgba(140,80,0,0.9) 60%, rgba(180,110,0,0.85) 100%); border:1px solid rgba(245,158,11,0.5); backface-visibility:visible; }
.btc3d-rotator::after { content:''; position:absolute; top:-8px; left:-8px; right:-8px; bottom:-8px; border-radius:50%; background:radial-gradient(circle, rgba(245,158,11,0.12) 0%, transparent 65%); animation:btcGlow 2s ease-in-out infinite; pointer-events:none; }
@keyframes btcGlow { 0%,100%{opacity:0.3} 50%{opacity:1} }
@keyframes btcGlitch { 0%,88%,92%,100%{filter:none} 89%{filter:drop-shadow(2px 0 0 rgba(255,0,64,0.5)) drop-shadow(-2px 0 0 rgba(0,255,136,0.5))} 90%{filter:drop-shadow(-1px 0 0 rgba(0,200,255,0.4)) drop-shadow(1px 0 0 rgba(255,0,64,0.4))} 91%{filter:none} 95%{filter:drop-shadow(1px 0 0 rgba(255,0,64,0.3))} 96%{filter:none} }

.boot-logo {
  font-family: 'Orbitron', monospace;
  font-size: 42px;
  font-weight: 900;
  color: #f59e0b;
  text-shadow: 0 0 10px rgba(245,158,11,0.5), 0 0 30px rgba(245,158,11,0.2);
  letter-spacing: 12px;
  animation: logoFlicker 4s ease-in-out infinite;
}
.boot-sub {
  font-family: 'Orbitron', monospace;
  font-size: 10px;
  color: #a8a29e;
  letter-spacing: 6px;
  margin-top: 8px;
  opacity: 0.8;
}

@keyframes logoFlicker {
  0%,100% { opacity:1; }
  92% { opacity:1; }
  93% { opacity:0.3; }
  94% { opacity:1; }
  96% { opacity:0.6; }
  97% { opacity:1; }
}

.terminal {
  width: 620px;
  background: rgba(42,37,35,0.6);
  border: 1px solid #3d3835;
  border-radius: 8px;
  padding: 20px;
  position: relative;
  box-shadow: 0 0 15px rgba(245,158,11,0.05), inset 0 0 30px rgba(0,0,0,0.3);
}
.terminal-header {
  display: flex;
  justify-content: space-between;
  border-bottom: 1px solid #3d3835;
  padding-bottom: 8px;
  margin-bottom: 12px;
  font-size: 10px;
  color: #78716c;
  font-family: 'Orbitron', monospace;
  letter-spacing: 1px;
}

#log {
  font-size: 12px;
  line-height: 1.7;
  min-height: 240px;
  max-height: 240px;
  overflow: hidden;
  color: #a8a29e;
}
#log .line {
  opacity: 0;
  animation: lineIn 0.1s forwards;
  white-space: nowrap;
}
@keyframes lineIn {
  to { opacity: 1; }
}
.line .ok { color: #22c55e; }
.line .warn { color: #f59e0b; }
.line .info { color: #22d3ee; }
.line .dim { color: #57534e; }
.line .bright { color: #f59e0b; text-shadow: 0 0 6px rgba(245,158,11,0.4); }

.progress-wrap {
  margin-top: 16px;
  border: 1px solid #3d3835;
  height: 18px;
  position: relative;
  background: #1c1917;
  border-radius: 4px;
  overflow: hidden;
}
.progress-bar {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, #d97706, #f59e0b);
  box-shadow: 0 0 10px rgba(245,158,11,0.3);
  transition: width 0.3s ease;
}
.progress-text {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 10px;
  color: #fafaf9;
  letter-spacing: 2px;
  z-index: 2;
  font-family: 'Orbitron', monospace;
}

.status-row {
  display: flex;
  justify-content: space-between;
  margin-top: 10px;
  font-size: 10px;
  color: #57534e;
  font-family: 'JetBrains Mono', monospace;
}
</style>
</head>
<body>

<div class="boot-container">
  <div class="boot-right">
    <div class="boot-header">
      <span class="btc3d"><div class="btc3d-scene"><div class="btc3d-rotator"><div class="btc3d-face btc3d-front"><div class="btc-coin-face"><div class="btc-ring"></div><span class="btc-symbol">B</span><div class="btc-holo-sheen"></div></div></div><div class="btc3d-face btc3d-back"><div class="btc-coin-face"><div class="btc-ring"></div><span class="btc-symbol">B</span><div class="btc-holo-sheen"></div></div></div><div class="btc3d-layer" style="transform:translateZ(6px)"></div><div class="btc3d-layer" style="transform:translateZ(5px)"></div><div class="btc3d-layer" style="transform:translateZ(4px)"></div><div class="btc3d-layer" style="transform:translateZ(3px)"></div><div class="btc3d-layer" style="transform:translateZ(2px)"></div><div class="btc3d-layer" style="transform:translateZ(1px)"></div><div class="btc3d-layer" style="transform:translateZ(0px)"></div><div class="btc3d-layer" style="transform:translateZ(-1px)"></div><div class="btc3d-layer" style="transform:translateZ(-2px)"></div><div class="btc3d-layer" style="transform:translateZ(-3px)"></div><div class="btc3d-layer" style="transform:translateZ(-4px)"></div><div class="btc3d-layer" style="transform:translateZ(-5px)"></div><div class="btc3d-layer" style="transform:translateZ(-6px)"></div></div></div></span>
      <div class="boot-logo">0xRex</div>
      <div class="boot-sub">AUTONOMOUS TRADING FRAMEWORK</div>
    </div>

    <div class="terminal">
      <div class="terminal-header">
        <span>0xRex BOOT SEQUENCE</span>
        <span id="clock">00:00:00</span>
      </div>
      <div id="log"></div>
      <div class="progress-wrap">
        <div class="progress-bar" id="pbar"></div>
        <div class="progress-text" id="ptxt">INITIALISING...</div>
      </div>
      <div class="status-row">
        <span id="sLeft">SUBSYSTEMS: STANDBY</span>
        <span id="sRight">ENCRYPTION: AES-256-GCM</span>
      </div>
    </div>
  </div>
</div>

<script>
const log = document.getElementById('log');
const pbar = document.getElementById('pbar');
const ptxt = document.getElementById('ptxt');
const sLeft = document.getElementById('sLeft');

setInterval(() => {
  const d = new Date();
  document.getElementById('clock').textContent =
    d.toTimeString().split(' ')[0];
}, 1000);

const lines = [
  { t:200,  txt:'> BIOS POST CHECK .......................... <span class="ok">[PASS]</span>' },
  { t:400,  txt:'> MEMORY ALLOCATION 4096MB ................. <span class="ok">[OK]</span>' },
  { t:600,  txt:'> SECURE BOOT VERIFICATION ................. <span class="ok">[VERIFIED]</span>' },
  { t:900,  txt:'> LOADING KERNEL MODULES ................... <span class="ok">[OK]</span>' },
  { t:1100, txt:'<span class="dim">  &#9500;&#9472;&#9472; crypto.aes256 ..................... loaded</span>' },
  { t:1250, txt:'<span class="dim">  &#9500;&#9472;&#9472; net.tls1.3 ....................... loaded</span>' },
  { t:1400, txt:'<span class="dim">  &#9492;&#9472;&#9472; sys.watchdog ..................... loaded</span>' },
  { t:1700, txt:'> INITIALISING TRADING ENGINE .............. <span class="info">[INIT]</span>' },
  { t:2000, txt:'> MOUNTING ENCRYPTED FILESYSTEM ............ <span class="ok">[MOUNTED]</span>' },
  { t:2300, txt:'> LOADING MARKET DATA FEEDS ................ <span class="ok">[CONNECTED]</span>' },
  { t:2600, txt:'> PORTFOLIO ENGINE BOOTSTRAP ............... <span class="ok">[READY]</span>' },
  { t:2900, txt:'> RISK MANAGEMENT MODULE ................... <span class="ok">[ARMED]</span>' },
  { t:3200, txt:'> SIGNAL PROCESSING PIPELINE ............... <span class="ok">[ONLINE]</span>' },
  { t:3500, txt:'> BROKER API HANDSHAKE ..................... <span class="warn">[STANDBY]</span>' },
  { t:3800, txt:'> AUTONOMOUS AGENT CORE ................... <span class="ok">[LOADED]</span>' },
  { t:4100, txt:'> SCANNING CRYPTO UNIVERSE (50+ ASSETS) ... <span class="info">[CACHED]</span>' },
  { t:4400, txt:'> SENTIMENT ANALYSIS ENGINE ................ <span class="ok">[READY]</span>' },
  { t:4700, txt:'> WEBSOCKET CHANNELS ...................... <span class="ok">[OPEN]</span>' },
  { t:5000, txt:'> COMMAND & CONTROL INTERFACE .............. <span class="ok">[ONLINE]</span>' },
  { t:5300, txt:'> STOP-LOSS / TAKE-PROFIT MONITOR ......... <span class="ok">[ARMED]</span>' },
  { t:5600, txt:'> FIREWALL RULES .......................... <span class="ok">[ENFORCED]</span>' },
  { t:5900, txt:'> SYSTEM INTEGRITY CHECK .................. <span class="ok">[PASS]</span>' },
  { t:6200, txt:'<span class="bright">> ALL SUBSYSTEMS OPERATIONAL</span>' },
  { t:6500, txt:'<span class="bright">> LAUNCHING 0xRex INTERFACE...</span>' },
];

const totalLines = lines.length;
lines.forEach((l, i) => {
  setTimeout(() => {
    const div = document.createElement('div');
    div.className = 'line';
    div.innerHTML = l.txt;
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
    const pct = Math.round(((i+1) / totalLines) * 100);
    pbar.style.width = pct + '%';
    ptxt.textContent = pct + '%';
    if (pct > 50) sLeft.textContent = 'SUBSYSTEMS: LOADING';
    if (pct > 90) sLeft.textContent = 'SUBSYSTEMS: ONLINE';
  }, l.t);
});

setTimeout(() => {
  ptxt.textContent = 'SYSTEM READY';
  ptxt.style.textShadow = '0 0 8px rgba(245,158,11,0.5)';
  if (window.pywebview) {
    window.pywebview.api.boot_complete();
  }
}, 7000);
</script>
</body>
</html>
