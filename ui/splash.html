<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap');

* { margin:0; padding:0; box-sizing:border-box; }
body {
  background: #1c1917;
  color: #fafaf9;
  font-family: 'JetBrains Mono', 'Courier New', monospace;
  overflow: hidden;
  height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  position: relative;
}
/* Scanlines */
body::before {
  content: '';
  position: fixed;
  top:0;left:0;right:0;bottom:0;
  background: repeating-linear-gradient(
    0deg,
    transparent 0px,
    rgba(245,158,11,0.012) 1px,
    transparent 2px
  );
  pointer-events: none;
  z-index: 100;
}
body::after {
  content: '';
  position: fixed;
  top:0;left:0;right:0;bottom:0;
  background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.5) 100%);
  pointer-events: none;
  z-index: 99;
}

.boot-container {
  display: flex;
  align-items: flex-start;
  gap: 30px;
}

.boot-right {
  display: flex;
  flex-direction: column;
  align-items: center;
}

.boot-header {
  text-align: center;
  margin-bottom: 30px;
}

/* ── 3D Spinning Coin ── */
.coin3d-wrap {
  display: inline-block;
  margin: 0 auto 10px;
  animation: coinGlitchMove 3s ease-in-out infinite, sceneFlicker 3s ease infinite;
}
.coin3d-scene {
  width: 120px;
  height: 120px;
  perspective: 800px;
}
.coin3d-rotator {
  width: 100%;
  height: 100%;
  position: relative;
  transform-style: preserve-3d;
  animation: coinSpin 5s linear infinite;
}
@keyframes coinSpin {
  0%   { transform: rotateY(0deg) rotateX(-8deg); }
  100% { transform: rotateY(360deg) rotateX(-8deg); }
}
.coin3d-face {
  position: absolute;
  width: 120px;
  height: 120px;
  border-radius: 50%;
  backface-visibility: hidden;
}
.coin3d-front { transform: translateZ(8px); }
.coin3d-back  { transform: rotateY(180deg) translateZ(8px); }

.coin-inner {
  width: 100%; height: 100%; border-radius: 50%; position: relative;
  background: radial-gradient(ellipse at 35% 35%, #f5c542 0%, #f59e0b 40%, #b8750a 75%, #8a5a08 100%);
  border: 3px solid #d48a06;
  box-shadow: inset 0 0 20px rgba(0,0,0,0.3), inset 0 2px 4px rgba(255,220,130,0.4),
    0 0 30px rgba(245,158,11,0.4), 0 0 60px rgba(245,158,11,0.15);
  display: flex; align-items: center; justify-content: center;
}
.coin-inner-back {
  background: radial-gradient(ellipse at 65% 65%, #f5c542 0%, #f59e0b 40%, #b8750a 75%, #8a5a08 100%);
}
.coin-ring {
  position: absolute; top: 8px; left: 8px; right: 8px; bottom: 8px;
  border: 2px solid rgba(255,220,130,0.35); border-radius: 50%;
}
.coin-symbol, .coin-symbol-back {
  font-family: 'Orbitron', monospace;
  font-size: 4.2rem;
  font-weight: 900;
  color: rgba(180, 130, 40, 0.18);
  text-shadow: none;
  position: relative;
  z-index: 1;
}

/* Coin edge - cylinder wall */
.coin3d-edge-wrap {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  transform-style: preserve-3d;
}
.coin3d-edge-seg {
  position: absolute;
  width: 12px; height: 16px;
  left: calc(50% - 6px); top: calc(50% - 8px);
  background: linear-gradient(180deg, #f5c542 0%, #b8750a 35%, #d48a06 50%, #8a5a08 75%, #a37208 100%);
  border-top: 1px solid rgba(255,220,130,0.25);
  border-bottom: 1px solid rgba(80,50,0,0.6);
  transform-origin: center center;
}

/* Coin glow */
.coin3d-rotator::after {
  content: '';
  position: absolute;
  top: -20px; left: -20px; right: -20px; bottom: -20px;
  background: radial-gradient(circle, rgba(245,158,11,0.15) 0%, transparent 60%);
  animation: coinGlow 2s ease-in-out infinite;
  pointer-events: none;
}
@keyframes coinGlow { 0%,100%{opacity:0.3} 50%{opacity:0.8} }

/* Glitch effect */
@keyframes coinGlitchMove {
  0%, 70% { transform: translate(0, 0) skew(0); filter: none; }
  71% { transform: translate(6px, -3px) skewX(-4deg); filter: hue-rotate(90deg) brightness(2) saturate(3); }
  72% { transform: translate(-8px, 3px) skewX(5deg); filter: hue-rotate(-60deg) brightness(0.4); }
  73% { transform: translate(4px, -2px) skewX(-3deg); filter: brightness(3) saturate(4) hue-rotate(120deg); }
  74% { transform: translate(-5px, 4px) skewX(6deg); filter: hue-rotate(-120deg) brightness(0.3); }
  75% { transform: translate(0, 0) skew(0); filter: none; }
  85% { transform: translate(0, 0) skew(0); filter: none; }
  86% { transform: translate(-5px, 2px) skewX(4deg); filter: brightness(0.2) hue-rotate(-90deg); }
  87% { transform: translate(8px, -3px) skewX(-7deg); filter: saturate(5) brightness(3); }
  88% { transform: translate(0, 0) skew(0); filter: none; }
  100% { transform: translate(0, 0) skew(0); filter: none; }
}
@keyframes sceneFlicker {
  0%, 100% { opacity: 1; }
  71% { opacity: 1; }
  71.5% { opacity: 0; }
  72% { opacity: 0.7; }
  72.5% { opacity: 0; }
  73% { opacity: 1; }
  73.5% { opacity: 0.1; }
  74% { opacity: 0.8; }
  75% { opacity: 0; }
  75.5% { opacity: 1; }
  86% { opacity: 1; }
  86.5% { opacity: 0; }
  87% { opacity: 0.5; }
  87.5% { opacity: 0; }
  88% { opacity: 1; }
}

.boot-logo {
  font-family: 'Orbitron', monospace;
  font-size: 42px;
  font-weight: 900;
  color: #f0e8dc;
  text-shadow: 0 0 10px rgba(240,232,220,0.3), 0 0 30px rgba(240,232,220,0.1);
  letter-spacing: 12px;
  animation: logoFlicker 4s ease-in-out infinite;
}
.boot-logo .logo-0x {
  color: #22c55e;
  text-shadow: 0 0 8px #22c55e, 0 0 20px rgba(34,197,94,0.4);
  animation: oxGlitch 4s ease-in-out infinite;
  display: inline-block;
  position: relative;
}
@keyframes oxGlitch {
  0%, 78%, 82%, 90%, 94%, 100% { text-shadow: 0 0 8px #22c55e, 0 0 20px rgba(34,197,94,0.4); transform: none; opacity: 1; }
  79% { text-shadow: -3px 0 #ff4466, 3px 0 #22c55e, 0 0 20px #22c55e; transform: translate(2px, -1px) skewX(-4deg); opacity: 0.8; }
  80% { text-shadow: 3px 0 #22c55e, -2px 0 #ff4466, 0 0 30px #22c55e; transform: translate(-3px, 1px) skewX(6deg); opacity: 0.3; }
  81% { text-shadow: -1px 0 #ff4466, 2px 0 #22c55e, 0 0 15px #22c55e; transform: translate(1px, -2px) skewX(-2deg); opacity: 0.9; }
  91% { text-shadow: 2px 0 #ff4466, -3px 0 #22c55e, 0 0 25px #22c55e; transform: translate(-2px, 1px) skewX(5deg); opacity: 0.4; }
  92% { text-shadow: -2px 0 #22c55e, 3px 0 #ff4466, 0 0 30px #22c55e; transform: translate(3px, 0) skewX(-3deg); opacity: 0.7; }
  93% { text-shadow: 0 0 8px #22c55e, 0 0 20px rgba(34,197,94,0.4); transform: translate(0, 0); opacity: 1; }
}
.boot-sub {
  font-family: 'Orbitron', monospace;
  font-size: 10px;
  color: #a8a29e;
  letter-spacing: 6px;
  margin-top: 8px;
  opacity: 0.8;
}

@keyframes logoFlicker {
  0%,100% { opacity:1; }
  92% { opacity:1; }
  93% { opacity:0.3; }
  94% { opacity:1; }
  96% { opacity:0.6; }
  97% { opacity:1; }
}

.terminal {
  width: 620px;
  background: rgba(42,37,35,0.6);
  border: 1px solid #3d3835;
  border-radius: 8px;
  padding: 20px;
  position: relative;
  box-shadow: 0 0 15px rgba(245,158,11,0.05), inset 0 0 30px rgba(0,0,0,0.3);
}
.terminal-header {
  display: flex;
  justify-content: space-between;
  border-bottom: 1px solid #3d3835;
  padding-bottom: 8px;
  margin-bottom: 12px;
  font-size: 10px;
  color: #78716c;
  font-family: 'Orbitron', monospace;
  letter-spacing: 1px;
}

#log {
  font-size: 12px;
  line-height: 1.7;
  min-height: 240px;
  max-height: 240px;
  overflow: hidden;
  color: #a8a29e;
}
#log .line {
  opacity: 0;
  animation: lineIn 0.1s forwards;
  white-space: nowrap;
}
@keyframes lineIn {
  to { opacity: 1; }
}
.line .ok { color: #22c55e; }
.line .warn { color: #f59e0b; }
.line .info { color: #22d3ee; }
.line .dim { color: #57534e; }
.line .bright { color: #f59e0b; text-shadow: 0 0 6px rgba(245,158,11,0.4); }

.progress-wrap {
  margin-top: 16px;
  border: 1px solid #3d3835;
  height: 18px;
  position: relative;
  background: #1c1917;
  border-radius: 4px;
  overflow: hidden;
}
.progress-bar {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, #d97706, #f59e0b);
  box-shadow: 0 0 10px rgba(245,158,11,0.3);
  transition: width 0.3s ease;
}
.progress-text {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 10px;
  color: #fafaf9;
  letter-spacing: 2px;
  z-index: 2;
  font-family: 'Orbitron', monospace;
}

.status-row {
  display: flex;
  justify-content: space-between;
  margin-top: 10px;
  font-size: 10px;
  color: #57534e;
  font-family: 'JetBrains Mono', monospace;
}
</style>
</head>
<body>

<div class="boot-container">
  <div class="boot-right">
    <div class="boot-header">
      <div class="coin3d-wrap">
        <div class="coin3d-scene">
          <div class="coin3d-rotator">
            <div class="coin3d-face coin3d-front"><div class="coin-inner"><span class="coin-symbol">&#8383;</span><span class="coin-ring"></span></div></div>
            <div class="coin3d-face coin3d-back"><div class="coin-inner coin-inner-back"><span class="coin-symbol-back">&#8383;</span><span class="coin-ring"></span></div></div>
            <div class="coin3d-edge-wrap" id="coinEdgeSplash"></div>
          </div>
        </div>
      </div>
      <div class="boot-logo"><span class="logo-0x">0X</span>REX</div>
      <div class="boot-sub">AUTONOMOUS TRADING FRAMEWORK</div>
    </div>

    <div class="terminal">
      <div class="terminal-header">
        <span>0xrex BOOT SEQUENCE</span>
        <span id="clock">00:00:00</span>
      </div>
      <div id="log"></div>
      <div class="progress-wrap">
        <div class="progress-bar" id="pbar"></div>
        <div class="progress-text" id="ptxt">INITIALISING...</div>
      </div>
      <div class="status-row">
        <span id="sLeft">SUBSYSTEMS: STANDBY</span>
        <span id="sRight">ENCRYPTION: AES-256-GCM</span>
      </div>
    </div>
  </div>
</div>

<script>
// Build 3D coin edge segments (cylinder wall)
function buildCoinEdge(id, segments, radius) {
  var el = document.getElementById(id);
  if (!el) return;
  for (var i = 0; i < segments; i++) {
    var angle = (i * 360) / segments;
    var seg = document.createElement('div');
    seg.className = 'coin3d-edge-seg';
    seg.style.transform = 'rotateZ(' + angle + 'deg) translateY(-' + radius + 'px) rotateX(90deg)';
    el.appendChild(seg);
  }
}
buildCoinEdge('coinEdgeSplash', 60, 60);

const log = document.getElementById('log');
const pbar = document.getElementById('pbar');
const ptxt = document.getElementById('ptxt');
const sLeft = document.getElementById('sLeft');

setInterval(() => {
  const d = new Date();
  document.getElementById('clock').textContent =
    d.toTimeString().split(' ')[0];
}, 1000);

const lines = [
  { t:200,  txt:'> BIOS POST CHECK .......................... <span class="ok">[PASS]</span>' },
  { t:400,  txt:'> MEMORY ALLOCATION 4096MB ................. <span class="ok">[OK]</span>' },
  { t:600,  txt:'> SECURE BOOT VERIFICATION ................. <span class="ok">[VERIFIED]</span>' },
  { t:900,  txt:'> LOADING KERNEL MODULES ................... <span class="ok">[OK]</span>' },
  { t:1100, txt:'<span class="dim">  &#9500;&#9472;&#9472; crypto.aes256 ..................... loaded</span>' },
  { t:1250, txt:'<span class="dim">  &#9500;&#9472;&#9472; net.tls1.3 ....................... loaded</span>' },
  { t:1400, txt:'<span class="dim">  &#9492;&#9472;&#9472; sys.watchdog ..................... loaded</span>' },
  { t:1700, txt:'> INITIALISING TRADING ENGINE .............. <span class="info">[INIT]</span>' },
  { t:2000, txt:'> MOUNTING ENCRYPTED FILESYSTEM ............ <span class="ok">[MOUNTED]</span>' },
  { t:2300, txt:'> LOADING MARKET DATA FEEDS ................ <span class="ok">[CONNECTED]</span>' },
  { t:2600, txt:'> PORTFOLIO ENGINE BOOTSTRAP ............... <span class="ok">[READY]</span>' },
  { t:2900, txt:'> RISK MANAGEMENT MODULE ................... <span class="ok">[ARMED]</span>' },
  { t:3200, txt:'> SIGNAL PROCESSING PIPELINE ............... <span class="ok">[ONLINE]</span>' },
  { t:3500, txt:'> BROKER API HANDSHAKE ..................... <span class="warn">[STANDBY]</span>' },
  { t:3800, txt:'> AUTONOMOUS AGENT CORE ................... <span class="ok">[LOADED]</span>' },
  { t:4100, txt:'> SCANNING CRYPTO UNIVERSE (50+ ASSETS) ... <span class="info">[CACHED]</span>' },
  { t:4400, txt:'> SENTIMENT ANALYSIS ENGINE ................ <span class="ok">[READY]</span>' },
  { t:4700, txt:'> WEBSOCKET CHANNELS ...................... <span class="ok">[OPEN]</span>' },
  { t:5000, txt:'> COMMAND & CONTROL INTERFACE .............. <span class="ok">[ONLINE]</span>' },
  { t:5300, txt:'> STOP-LOSS / TAKE-PROFIT MONITOR ......... <span class="ok">[ARMED]</span>' },
  { t:5600, txt:'> FIREWALL RULES .......................... <span class="ok">[ENFORCED]</span>' },
  { t:5900, txt:'> SYSTEM INTEGRITY CHECK .................. <span class="ok">[PASS]</span>' },
  { t:6200, txt:'<span class="bright">> ALL SUBSYSTEMS OPERATIONAL</span>' },
  { t:6500, txt:'<span class="bright">> LAUNCHING 0xrex INTERFACE...</span>' },
];

const totalLines = lines.length;
lines.forEach((l, i) => {
  setTimeout(() => {
    const div = document.createElement('div');
    div.className = 'line';
    div.innerHTML = l.txt;
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
    const pct = Math.round(((i+1) / totalLines) * 100);
    pbar.style.width = pct + '%';
    ptxt.textContent = pct + '%';
    if (pct > 50) sLeft.textContent = 'SUBSYSTEMS: LOADING';
    if (pct > 90) sLeft.textContent = 'SUBSYSTEMS: ONLINE';
  }, l.t);
});

setTimeout(() => {
  ptxt.textContent = 'SYSTEM READY';
  ptxt.style.textShadow = '0 0 8px rgba(245,158,11,0.5)';
  if (window.pywebview) {
    window.pywebview.api.boot_complete();
  }
}, 7000);
</script>
</body>
</html>
